services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Not published to the host: only reachable by other containers on the
    # "burny-network" network (e.g. the frontend's nginx proxy).
    expose:
      - "8080"
    env_file:
      - .env
    networks:
      - burny-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend
    networks:
      - burny-network
    restart: unless-stopped

networks:
  burny-network:
    driver: bridge

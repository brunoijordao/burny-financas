server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy: forward /api/* to the backend service on the internal
    # Docker network (service name "backend", not localhost).
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static build assets aggressively; index.html is handled below
    # and must always be revalidated so new deploys are picked up.
    location ~* \.(?:css|js|mjs|json|jpg|jpeg|gif|png|svg|ico|webp|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # React Router (client-side routing): fall back to index.html for any
    # route that doesn't match a real static file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
